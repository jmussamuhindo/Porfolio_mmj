<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>
    (function(){try{if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();
  </script>
  <style>
    .admin-wrap { max-width: 1000px; }
    .login-card { max-width: 520px; margin: 0 auto; }
    .hidden { display: none !important; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
    .toolbar .who { color: var(--text-muted); font-size: 0.9rem; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 20px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: 0.9rem; box-shadow: var(--shadow); z-index: 100; opacity: 0; transition: opacity .3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 90; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow: auto; }
    .modal { width: 100%; max-width: 760px; }
    .dirty-bar { position: sticky; top: 64px; z-index: 40; background: var(--surface); border: 1px solid var(--accent); border-radius: var(--radius); padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; box-shadow: var(--shadow); }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    small.help { display: block; color: var(--text-muted); font-size: 0.8rem; margin-top: 4px; }
    .status-pill { display: inline-block; }
  </style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <header class="site-header">
    <nav class="nav container">
      <a href="/" class="brand"><span class="brand-mark"></span>Admin</a>
      <div class="nav-right">
        <ul class="nav-links"><li><a href="/">← Back to site</a></li></ul>
        <button class="theme-toggle" aria-label="Toggle dark mode" id="themeBtn">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </nav>
  </header>

  <main>
    <!-- LOGIN -->
    <section id="login" class="section container admin-wrap">
      <div class="page-head" style="padding-top:40px">
        <p class="eyebrow mono">private</p>
        <h1>Sign in</h1>
        <p class="lead">Enter your GitHub access token. Edits are saved as commits to your repository and go live about a minute later.</p>
      </div>
      <form class="card contact-form login-card" id="loginForm">
        <label><span>GitHub token</span><input type="password" id="token" autocomplete="current-password" required placeholder="github_pat_…">
          <small class="help">Fine-grained token with <b>Contents: read &amp; write</b> on this repository. Create one at github.com → Settings → Developer settings → Personal access tokens.</small>
        </label>
        <label class="check" style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="remember" style="width:auto"> <span>Stay signed in on this device</span></label>
        <div class="form-actions"><button class="btn btn-primary" type="submit">Sign in</button></div>
        <p id="loginErr" class="muted" style="color:var(--error);margin:12px 0 0"></p>
      </form>
    </section>

    <!-- DASHBOARD -->
    <section id="dash" class="section container admin-wrap hidden">
      <div class="toolbar">
        <div><h1 style="margin:0;font-size:2.2rem">Admin</h1><span class="who" id="who"></span></div>
        <div style="display:flex;gap:8px"><a href="/" class="btn btn-small" target="_blank">View site ↗</a><button class="btn btn-small" id="logout">Sign out</button></div>
      </div>

      <div class="dirty-bar hidden" id="dirtyBar">
        <span><b id="dirtyCount">0</b> unsaved change(s)</span>
        <div style="display:flex;gap:8px"><button class="btn btn-small" id="discard">Discard</button><button class="btn btn-small btn-primary" id="publish">Publish to site</button></div>
      </div>

      <div class="section-head"><h2>Publications</h2><button class="btn btn-primary btn-small section-link" id="addArticle">+ Add article</button></div>
      <table class="admin-table" id="articlesTable"><thead><tr><th>Year</th><th>Title</th><th>Status</th><th>Link</th><th></th></tr></thead><tbody></tbody></table>

      <div class="section-head" style="margin-top:56px"><h2>Projects</h2><button class="btn btn-primary btn-small section-link" id="addProject">+ Add project</button></div>
      <table class="admin-table" id="projectsTable"><thead><tr><th>Year</th><th>Title</th><th>Featured</th><th>Links</th><th></th></tr></thead><tbody></tbody></table>
    </section>
  </main>

  <!-- ARTICLE MODAL -->
  <div class="modal-bg hidden" id="articleModal">
    <form class="card contact-form modal" id="articleForm">
      <h2 id="articleModalTitle" style="margin-top:0">Article</h2>
      <input type="hidden" name="idx">
      <label><span>Title *</span><input name="title" required></label>
      <label><span>Authors</span><input name="authors" placeholder="M. J. Muhindo, A. Nowakowski"></label>
      <label><span>Venue / journal / conference</span><input name="venue"></label>
      <div class="form-row">
        <label><span>Year</span><input name="year" type="number"></label>
        <label><span>Type</span><select name="type"><option>Journal article</option><option>Conference talk</option><option>Conference paper</option><option>Data paper</option><option>Preprint</option><option>Poster</option><option>Book chapter</option><option>Thesis</option></select></label>
        <label><span>Status</span><select name="status"><option>in progress</option><option>submitted</option><option>under review</option><option>accepted</option><option>presented</option><option>published</option></select></label>
      </div>
      <label><span>Link (DOI, PDF, conference page) — empty if none yet</span><input name="link" type="url" placeholder="https://"></label>
      <label><span>Abstract / summary</span><textarea name="abstract" rows="5"></textarea></label>
      <div class="form-actions"><button class="btn btn-primary" type="submit">Save</button><button class="btn" type="button" data-close>Cancel</button></div>
    </form>
  </div>

  <!-- PROJECT MODAL -->
  <div class="modal-bg hidden" id="projectModal">
    <form class="card contact-form modal" id="projectForm">
      <h2 id="projectModalTitle" style="margin-top:0">Project</h2>
      <input type="hidden" name="idx">
      <label><span>Title *</span><input name="title" required></label>
      <label><span>URL slug (empty = from title)</span><input name="slug" placeholder="my-project"></label>
      <label><span>Short summary (card)</span><input name="summary"></label>
      <label><span>Full description (project page)</span><textarea name="description" rows="5"></textarea></label>
      <label><span>Highlights — one per line</span><textarea name="highlights" rows="4"></textarea></label>
      <label><span>Tags — comma separated</span><input name="tags" placeholder="Python, PyTorch, Epidemiology"></label>
      <div class="form-row">
        <label><span>Year</span><input name="year" type="number"></label>
        <label><span>Accent colour</span><input name="accent" type="color" value="#6d4aff"></label>
        <label class="check"><input type="checkbox" name="featured"> <span>Featured on home</span></label>
      </div>
      <label><span>Code repository link</span><input name="repo" type="url" placeholder="https://github.com/…"></label>
      <label><span>Live demo / paper link</span><input name="demo" type="url" placeholder="https://"></label>
      <div class="form-actions"><button class="btn btn-primary" type="submit">Save</button><button class="btn" type="button" data-close>Cancel</button></div>
    </form>
  </div>

  <div class="toast" id="toast"></div>

<script>
// ===== CONFIG — your repository =====
const REPO = { owner: "jmussamuhindo", name: "Porfolio_mmj", branch: "main" };
const FILES = { articles: "data/articles.json", projects: "data/projects.json" };

// ===== state =====
let token = null;
let state = { articles: null, projects: null };     // current edited data
let original = { articles: null, projects: null };  // as loaded from GitHub
let shas = { articles: null, projects: null };

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg, ms = 2500) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), ms); }

// ===== GitHub API =====
const api = (path, opts = {}) => fetch(`https://api.github.com${path}`, {
  ...opts, headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", ...(opts.headers || {}) }
});
const b64decode = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));
const b64encode = s => { const b = new TextEncoder().encode(s); let bin = ""; b.forEach(x => bin += String.fromCharCode(x)); return btoa(bin); };

async function loadFile(key) {
  const r = await api(`/repos/${REPO.owner}/${REPO.name}/contents/${FILES[key]}?ref=${REPO.branch}`);
  if (!r.ok) throw new Error(`${FILES[key]}: ${r.status}`);
  const j = await r.json();
  shas[key] = j.sha;
  const data = JSON.parse(b64decode(j.content));
  state[key] = data; original[key] = JSON.stringify(data);
}
async function saveFile(key, message) {
  const body = { message, branch: REPO.branch, sha: shas[key], content: b64encode(JSON.stringify(state[key], null, 2) + "\n") };
  const r = await api(`/repos/${REPO.owner}/${REPO.name}/contents/${FILES[key]}`, { method: "PUT", body: JSON.stringify(body) });
  if (!r.ok) throw new Error(`${FILES[key]}: ${r.status} ${(await r.json()).message || ""}`);
  const j = await r.json(); shas[key] = j.content.sha; original[key] = JSON.stringify(state[key]);
}

// ===== auth =====
async function signIn(t, remember) {
  token = t;
  const r = await api("/user");
  if (!r.ok) { token = null; throw new Error(r.status === 401 ? "Invalid token." : `GitHub error ${r.status}`); }
  const u = await r.json();
  $("#who").textContent = `Signed in as ${u.login} · editing ${REPO.owner}/${REPO.name}`;
  try { (remember ? localStorage : sessionStorage).setItem("gh_token", t); } catch (e) {}
  await Promise.all([loadFile("articles"), loadFile("projects")]);
  $("#login").classList.add("hidden"); $("#dash").classList.remove("hidden");
  render();
}
function signOut() { token = null; try { localStorage.removeItem("gh_token"); sessionStorage.removeItem("gh_token"); } catch (e) {} location.reload(); }

$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault(); $("#loginErr").textContent = "";
  try { await signIn($("#token").value.trim(), $("#remember").checked); } catch (err) { $("#loginErr").textContent = err.message; }
});
$("#logout").addEventListener("click", signOut);

// ===== dirty tracking / publish =====
function dirtyCount() { return ["articles", "projects"].filter(k => JSON.stringify(state[k]) !== original[k]).length; }
function updateDirty() { const n = dirtyCount(); $("#dirtyBar").classList.toggle("hidden", n === 0); $("#dirtyCount").textContent = n; }
$("#discard").addEventListener("click", () => { for (const k of ["articles", "projects"]) state[k] = JSON.parse(original[k]); render(); toast("Changes discarded"); });
$("#publish").addEventListener("click", async () => {
  const btn = $("#publish"); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Publishing…';
  try {
    for (const k of ["articles", "projects"]) if (JSON.stringify(state[k]) !== original[k]) await saveFile(k, `Update ${k} via admin`);
    updateDirty(); toast("Published — live in about a minute", 4000);
  } catch (err) { alert("Publish failed: " + err.message); }
  btn.disabled = false; btn.textContent = "Publish to site";
});
window.addEventListener("beforeunload", e => { if (dirtyCount()) { e.preventDefault(); e.returnValue = ""; } });

// ===== render =====
function render() {
  const at = $("#articlesTable tbody");
  at.innerHTML = state.articles.map((a, i) => `<tr>
    <td class="mono">${esc(a.year)}</td>
    <td>${esc(a.title)}<br><small class="muted">${esc(a.authors)}</small></td>
    <td><span class="status status-${esc((a.status || "in progress").replace(/ /g, "-"))}">${esc(a.status)}</span></td>
    <td>${a.link ? `<a href="${esc(a.link)}" target="_blank" rel="noopener">↗</a>` : '<span class="muted">—</span>'}</td>
    <td class="admin-actions"><button class="btn btn-small" data-edit-article="${i}">Edit</button> <button class="btn btn-small btn-danger" data-del-article="${i}">Delete</button></td>
  </tr>`).join("") || '<tr><td colspan="5" class="muted">No articles yet.</td></tr>';

  const pt = $("#projectsTable tbody");
  pt.innerHTML = state.projects.map((p, i) => `<tr>
    <td class="mono">${esc(p.year)}</td>
    <td>${esc(p.title)}<br><small class="muted">/projects/${esc(p.slug)}</small></td>
    <td>${p.featured ? '<span class="pill">Featured</span>' : '<span class="muted">—</span>'}</td>
    <td>${p.repo ? `<a href="${esc(p.repo)}" target="_blank" rel="noopener">code</a> ` : ""}${p.demo ? `<a href="${esc(p.demo)}" target="_blank" rel="noopener">demo</a>` : ""}${!p.repo && !p.demo ? '<span class="muted">—</span>' : ""}</td>
    <td class="admin-actions"><button class="btn btn-small" data-edit-project="${i}">Edit</button> <button class="btn btn-small btn-danger" data-del-project="${i}">Delete</button></td>
  </tr>`).join("") || '<tr><td colspan="5" class="muted">No projects yet.</td></tr>';
  updateDirty();
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.editArticle != null) openArticle(+b.dataset.editArticle);
  if (b.dataset.delArticle != null && confirm("Delete this article?")) { state.articles.splice(+b.dataset.delArticle, 1); render(); }
  if (b.dataset.editProject != null) openProject(+b.dataset.editProject);
  if (b.dataset.delProject != null && confirm("Delete this project?")) { state.projects.splice(+b.dataset.delProject, 1); render(); }
  if (b.hasAttribute("data-close")) b.closest(".modal-bg").classList.add("hidden");
});
$("#addArticle").addEventListener("click", () => openArticle(null));
$("#addProject").addEventListener("click", () => openProject(null));

// ===== article modal =====
function openArticle(i) {
  const f = $("#articleForm"), a = i == null ? { year: new Date().getFullYear(), status: "in progress", type: "Journal article" } : state.articles[i];
  $("#articleModalTitle").textContent = i == null ? "New article" : "Edit article";
  f.idx.value = i == null ? "" : i;
  for (const k of ["title", "authors", "venue", "year", "type", "status", "link", "abstract"]) f[k].value = a[k] ?? "";
  $("#articleModal").classList.remove("hidden"); f.title.focus();
}
$("#articleForm").addEventListener("submit", e => {
  e.preventDefault(); const f = e.target;
  const a = { title: f.title.value.trim(), authors: f.authors.value.trim(), venue: f.venue.value.trim(), year: +f.year.value || 0,
    type: f.type.value, status: f.status.value, abstract: f.abstract.value.trim(), link: f.link.value.trim() || null };
  if (f.idx.value === "") state.articles.unshift(a); else state.articles[+f.idx.value] = a;
  $("#articleModal").classList.add("hidden"); render();
});

// ===== project modal =====
const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "project";
function openProject(i) {
  const f = $("#projectForm"), p = i == null ? { year: new Date().getFullYear(), accent: "#6d4aff", featured: false } : state.projects[i];
  $("#projectModalTitle").textContent = i == null ? "New project" : "Edit project";
  f.idx.value = i == null ? "" : i;
  for (const k of ["title", "slug", "summary", "description", "year", "repo", "demo"]) f[k].value = p[k] ?? "";
  f.accent.value = p.accent || "#6d4aff"; f.featured.checked = !!p.featured;
  f.highlights.value = (p.highlights || []).join("\n"); f.tags.value = (p.tags || []).join(", ");
  $("#projectModal").classList.remove("hidden"); f.title.focus();
}
$("#projectForm").addEventListener("submit", e => {
  e.preventDefault(); const f = e.target, idx = f.idx.value === "" ? null : +f.idx.value;
  const p = { slug: slugify(f.slug.value.trim() || f.title.value), title: f.title.value.trim(), summary: f.summary.value.trim(),
    description: f.description.value.trim(), highlights: f.highlights.value.split("\n").map(s => s.trim()).filter(Boolean),
    tags: f.tags.value.split(",").map(s => s.trim()).filter(Boolean), year: +f.year.value || 0, featured: f.featured.checked,
    repo: f.repo.value.trim() || null, demo: f.demo.value.trim() || null, accent: f.accent.value };
  if (state.projects.some((x, j) => x.slug === p.slug && j !== idx)) { alert(`A project with slug “${p.slug}” already exists.`); return; }
  if (idx == null) state.projects.unshift(p); else state.projects[idx] = p;
  $("#projectModal").classList.add("hidden"); render();
});

// ===== theme + auto sign-in =====
$("#themeBtn").addEventListener("click", () => { const r = document.documentElement, d = r.getAttribute("data-theme") === "dark"; d ? r.removeAttribute("data-theme") : r.setAttribute("data-theme", "dark"); try { localStorage.setItem("theme", d ? "light" : "dark"); } catch (e) {} });
(async () => { let t = null; try { t = localStorage.getItem("gh_token") || sessionStorage.getItem("gh_token"); } catch (e) {} if (t) { try { await signIn(t, !!localStorage.getItem("gh_token")); } catch (e) { signOut(); } } })();
</script>
</body>
</html>
